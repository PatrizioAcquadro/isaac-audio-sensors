[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-audio-sensors"
version = "1.10.0"
description = "Reusable audio-sensor models and lazy Isaac Sim/Lab helpers for robotics simulation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "isaac-audio-sensors contributors" },
]
keywords = [
    "isaac-sim",
    "isaac-lab",
    "robotics",
    "audio",
    "tdoa",
    "microphone-array",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jsonschema>=4.10",
    "numpy>=1.26",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
room = [
    "pyroomacoustics>=0.7",
    "scipy>=1.11",
    "soundfile>=0.12",
]
docs = [
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.25",
]
examples = [
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
isaac-audio-sensors = "isaac_audio_sensors.cli:main"

[project.urls]
Source = "https://github.com/PatrizioAcquadro/isaac-audio-sensors"
Showcase = "https://isaac-audio-showcase-site.vercel.app"
Documentation = "https://isaac-audio-showcase-site.vercel.app"
Changelog = "https://github.com/PatrizioAcquadro/isaac-audio-sensors/blob/main/CHANGELOG.md"
Issues = "https://github.com/PatrizioAcquadro/isaac-audio-sensors/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["isaac_audio_sensors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "phase_gate: phase-specific acceptance, evidence, or closeout gate",
  "historical: frozen earlier-phase behavior retained for audit and replay",
  "artifact: builds or validates evidence, package, replay, or distribution artifacts",
  "slow: measured long-running test unsuitable for the default feedback loop",
  "hardware: requires explicitly authorized physical hardware or retained hardware data",
  "s4_2_hardware: requires the live S4.2 ZED, ReSpeaker, Pi, Mac, and operator gate",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
