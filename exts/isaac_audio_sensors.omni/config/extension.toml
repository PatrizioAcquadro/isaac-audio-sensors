[package]
# Kit extension manifests require SemVer spelling. The Python package release
# uses the same final SemVer spelling for 1.5.0.
version = "1.5.0"
title = "Isaac Audio Sensors"
description = "Reference Isaac Sim Kit workflow for audio-array metadata, live sensor control, overlays, and JSON/JSONL export."
authors = ["Patrizio Acquadro"]
author = "Patrizio Acquadro"
repository = "https://github.com/PatrizioAcquadro/isaac-audio-sensors"
category = "Simulation"
keywords = ["audio", "microphone", "microphone-array", "sensor", "robotics", "isaac-sim", "omniverse", "usd", "tdoa", "simulation"]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
icon = "data/icon.svg"
preview_image = "data/preview.png"
trusted = false
support_level = "Community"

[dependencies]
"omni.kit.actions.core" = {}
"omni.kit.menu.utils" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.hotkeys.core" = { optional = true }
# Optional extension-only recording path. Core package imports do not depend on it.
"omni.replicator.core" = { optional = true }
# Optional Action Graph integration; the node registers only when present.
"omni.graph.core" = { optional = true }

[settings]
exts."isaac_audio_sensors.omni".shortcut = "CTRL + ALT + A"

[documentation]
pages = [
    "docs/README.md",
    "docs/CHANGELOG.md",
]

[[python.module]]
name = "isaac_audio_sensors_omni"
