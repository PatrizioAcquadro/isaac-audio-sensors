name: Publish Python distributions

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build:
    name: Build and audit distributions
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.project.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read and validate project version
        id: project
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match v${version}." >&2
            exit 1
          fi
      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]" "twine>=6.1,<7"
      - name: Run deterministic host gate
        run: make check PYTHON=python
      - name: Prepare locked Kit wheelhouse
        shell: bash
        run: |
          wheelhouse="${RUNNER_TEMP}/kit-wheelhouse"
          mkdir -p "${wheelhouse}"
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --dest "${wheelhouse}" \
            --requirement tools/release/kit_dependencies.lock
          python tools/release/build_kit_extension.py \
            --wheelhouse "${wheelhouse}" \
            --validate-wheelhouse
      - name: Build and audit exact release outbox
        shell: bash
        run: |
          make release PYTHON=python WHEELHOUSE="${RUNNER_TEMP}/kit-wheelhouse"
          python -m twine check dist/*.tar.gz dist/*.whl
          mkdir -p build/python-dist
          cp -- dist/*.tar.gz dist/*.whl build/python-dist/
      - name: Upload audited Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: build/python-dist/
          if-no-files-found: error
          retention-days: 7

  check-testpypi:
    name: Recheck TestPyPI distributions
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download audited Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Recheck downloaded distributions
        run: |
          python -m pip install "twine>=6.1,<7"
          python -m twine check dist/*

  publish-testpypi:
    name: Upload release to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - check-testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/isaac-audio-sensors
    permissions:
      id-token: write
    steps:
      - name: Download audited Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI ${{ matrix.distribution }} installation
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: wheel with room extra
            package: isaac-audio-sensors[room]
            install-args: --only-binary=isaac-audio-sensors
            optional-audio: true
          - distribution: source distribution
            package: isaac-audio-sensors
            install-args: --no-binary=isaac-audio-sensors --no-build-isolation
            optional-audio: false
    steps:
      - name: Check out verification smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Prepare clean verification environment from PyPI
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/verify"
          "${RUNNER_TEMP}/verify/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/verify/bin/python" -m pip install \
            "setuptools>=77" wheel \
            "numpy>=1.26" "pyroomacoustics>=0.7" "scipy>=1.11" "soundfile>=0.12"
      - name: Install exact package from TestPyPI
        shell: bash
        run: |
          for attempt in {1..12}; do
            if "${RUNNER_TEMP}/verify/bin/python" -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --no-deps \
              ${{ matrix.install-args }} \
              "${{ matrix.package }}==${{ needs.build.outputs.version }}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify installed package and optional audio
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$("${RUNNER_TEMP}/verify/bin/isaac-audio-sensors" --version)" = "${EXPECTED_VERSION}"
          "${RUNNER_TEMP}/verify/bin/python" -c \
            'import isaac_audio_sensors, os; assert isaac_audio_sensors.__version__ == os.environ["EXPECTED_VERSION"]'
      - name: Verify optional room and FLAC execution
        if: matrix.optional-audio
        run: |
          "${RUNNER_TEMP}/verify/bin/python" tools/smoke/optional_audio.py

  check-pypi:
    name: Recheck PyPI distributions
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download audited Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Recheck downloaded distributions
        run: |
          python -m pip install "twine>=6.1,<7"
          python -m twine check dist/*

  publish-pypi:
    name: Upload release to PyPI
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs:
      - build
      - check-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isaac-audio-sensors
    permissions:
      id-token: write
    steps:
      - name: Download audited Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  verify-pypi:
    name: Verify PyPI on Python ${{ matrix.python-version }}
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact package from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for attempt in {1..12}; do
            if python -m pip install "isaac-audio-sensors==${{ needs.build.outputs.version }}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify installed package
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(isaac-audio-sensors --version)" = "${EXPECTED_VERSION}"
          python -c \
            'import isaac_audio_sensors, os; assert isaac_audio_sensors.__version__ == os.environ["EXPECTED_VERSION"]'

  verify-pypi-room:
    name: Verify PyPI room extra
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out verification smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact room extra from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          for attempt in {1..12}; do
            if python -m pip install "isaac-audio-sensors[room]==${{ needs.build.outputs.version }}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify optional audio
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(isaac-audio-sensors --version)" = "${EXPECTED_VERSION}"
          python -c \
            'import isaac_audio_sensors, os; assert isaac_audio_sensors.__version__ == os.environ["EXPECTED_VERSION"]'
          python tools/smoke/optional_audio.py
